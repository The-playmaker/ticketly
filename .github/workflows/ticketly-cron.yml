name: Ticketly cron

# Vercel Hobby blocks frequent crons, so GitHub calls the protected
# /api/cron/* routes instead. Needs repo secret CRON_SECRET (same value as
# in Vercel). Optional repo variable TICKETLY_URL (default below).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ticketly-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: ${{ vars.TICKETLY_URL || 'https://billett.xodrammen.no' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add repository secret CRON_SECRET (same as Vercel env)"; exit 1
          fi
      - name: Reconcile payments with Stripe (marks paid, issues missing tickets, cancels expired)
        run: |
          curl -sS --fail-with-body --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/cron/payments-reconcile?provider=all&sinceHours=48&limit=200" | head -c 4000
      - name: Expire stale reservations
        if: always()
        run: |
          curl -sS --fail-with-body --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/cron/reservations-cleanup" | head -c 2000
