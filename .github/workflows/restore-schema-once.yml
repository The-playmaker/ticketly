name: restore-schema-once
on:
  push:
    branches: [cursor/security-audit-2-9546]
    paths:
      - "packages/database/prisma/.schema-restore/**"
      - ".github/workflows/restore-schema-once.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/security-audit-2-9546
      - name: Assemble schema.prisma from parts
        run: |
          set -euo pipefail
          PART_DIR="packages/database/prisma/.schema-restore"
          if [ ! -d "$PART_DIR" ]; then echo "no parts"; exit 0; fi
          cat "$PART_DIR"/part-*.txt > packages/database/prisma/schema.prisma
          # Verify promoReleasedAt present
          grep -q promoReleasedAt packages/database/prisma/schema.prisma
          rm -rf "$PART_DIR"
          rm -f .github/workflows/restore-schema-once.yml
          git config user.name "ticketly-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): restore full schema.prisma with Order.promoReleasedAt" || exit 0
          git push
